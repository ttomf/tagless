<style>
:root {
    --color0: #ffffff;
    --color1: #f0f0f0;
    --color2: #003c23;
    --radius: 1rem;
}

@font-face {
    font-family: "JetBrains Mono Nerd";
    src: url("https://cdn.jsdelivr.net/gh/Nick2bad4u/nerd-fonts-woff2@main/fonts/woff2/DejaVuSansMono/DejaVuSansMNerdFont-Regular.woff2")
        format("woff2");
    font-display: swap;
}

/* main container */
html {
    background-color: var(--color1);
    font-family: "JetBrains Mono Nerd", monospace;

    display: block;
    width: 80%;
    margin: 3rem auto;
    height: 25.5rem; /* needs to be calculated manually from content */

    border-radius: var(--radius);
    box-shadow: inset var(--color0) 0 0 10000px;
}

head {
    display: block;
    margin: 0.5rem;
}

/* main content */
head::before {
    content: "\
󱠡 HELLO!\
\a\a This is a simple web page using only the <style> tag, created for https://tagless.hackclub.com/.\
\a\a How is this made?\
\a\a CSS can have ::before and ::after pseudo elements for every element, including the <html>, <head> and <body> elements.\
\a They are added automatically by the browser, so only explicitly written element is <style> which contains the whole page.\
\a Unfortunately, ::before and ::after pseudo elements are not selectable, so you can't copy the text.\
\a You are currently reading head::before!\
\a This container is just a box-shadow with inset on <html> element.\
\a The following game uses <body> as main container, and ::before and ::after as labels.\
\a It uses body:hover and body:active to get state and two animations to increase points.\
\a\a GAME TIME!\
\a\a Hover over the box only when it's green. Don't destroy it by clicking!\
";

    display: block;
    width: 100%;

    text-align: center;
    white-space: pre-wrap;
}

/* game */
@property --can-hover {
    syntax: "<integer>";
    inherits: false;
    initial-value: 0;
}

@property --points {
    syntax: "<integer>";
    inherits: true;
    initial-value: 0;
}

@property --antipoints {
    syntax: "<integer>";
    inherits: true;
    initial-value: 0;
}

@keyframes score {
    to {
        --points: 100;
    }
}

@keyframes antiscore {
    to {
        --antipoints: 100;
    }
}

@keyframes game {
    0% {
        --can-hover: 0;
    }
    50% {
        --can-hover: 1;
    }
    100% {
        --can-hover: 0;
    }
}

@keyframes destroy {
    to {
        visibility: hidden;
    }
}

@keyframes destroy-after {
    to {
        content: "I told you!";
        color: black;
    }
}

@counter-style result {
    system: fixed 0;
    suffix: "";
    symbols: "" "YOU WON" "YOU LOST" "Yeah, CSS cannot stop the game...";
}

/* game panel */
body {
    --scoring: paused;
    --antiscoring: paused;
    --hover: 0;

    position: relative;
    height: 4.5rem;

    background-color: hsl(
        calc(var(--can-hover) * 120),
        100%,
        calc(50% - var(--can-hover) * 10%)
    );

    border-radius: var(--radius);

    animation:
        game 2s linear infinite,
        destroy 2s linear forwards;
    animation-play-state: running, paused;
}

body:hover {
    --hover: 1;
}

@container style(--hover: 1) and style(--can-hover: 1) {
    body::before {
        --scoring: running;
        --antiscoring: paused;
    }
}

@container style(--hover: 1) and style(--can-hover: 0) {
    body::before {
        --scoring: paused;
        --antiscoring: running;
    }
}

/* small game label */
body::before {
    content: "Points: " counter(points) " Antipoints: " counter(antipoints);

    color: var(--color0);

    position: absolute;
    top: 1rem;
    left: 0;
    right: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    /* content cannot have <integer> property, so we need to use counter */
    counter-reset: points var(--points) antipoints var(--antipoints) result
        calc(
            round(down, var(--points) / 100, 1) +
                round(down, var(--antipoints) / 100, 1) * 2
        );
    animation:
        score 3s linear forwards,
        antiscore 0.5s linear forwards;
    animation-play-state: var(--scoring), var(--antiscoring);
}

/* main game label */
body::after {
    content: counter(result, result);

    font-size: 1.5rem;
    color: var(--color0);

    position: absolute;
    left: 0;
    right: 0;
    bottom: 0.5rem;

    display: flex;
    justify-content: center;
    align-items: center;

    animation: destroy-after 2s step-end forwards;
    animation-play-state: paused;
    visibility: visible;
}

body:active::after {
    content: "Just hover, your mouse button is destroying me!";
    animation-play-state: running;
}

body:active {
    background-color: blue;
    animation-play-state: running;
}

/* footer */
html::after {
    content: " ttomf 2026 · made with  and without 󰅴 ";

    background-color: var(--color2);
    color: var(--color1);

    display: block;
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;

    text-align: center;
    padding-top: 1rem;
    padding-bottom: 1rem;

    border-radius: var(--radius) var(--radius) 0 0;
}
</style>
